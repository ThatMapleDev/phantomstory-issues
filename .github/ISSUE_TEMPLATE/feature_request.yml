name: Feature idea
description: Suggest something new or a way to make the game better.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you want?
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: Which problem does it solve, or what would it make better for you?
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: How it works in the original game or other games. Screenshots welcome.
    validations:
      required: false
